name: Deploy GitHub runner fleet

on:
  workflow_dispatch:
    inputs:
      vm_type:
        description: "GCP machine type for the runner VMs"
        required: true
        type: string
        default: "e2-medium"
      runner_name:
        description: "Prefix for the GitHub-registered runner name"
        required: true
        type: string
        default: "gh-runner"
      runner_count:
        description: "Max number of runner VMs (autoscaler ceiling); min stays at the module default"
        required: true
        type: string
        default: "1"

permissions:
  contents: read
  id-token: write

env:
  TF_WORKING_DIR: .

jobs:
  deploy:
    name: terraform apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=gh-runners"

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -out=tfplan \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="github_owner=${{ vars.GH_RUNNER_OWNER }}" \
            -var="github_repo=${{ vars.GH_RUNNER_REPO }}" \
            -var="server_machine_type=${{ inputs.vm_type }}" \
            -var="runner_name=${{ inputs.runner_name }}" \
            -var="max_runners=${{ inputs.runner_count }}"

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Store GitHub PAT in Secret Manager
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          SECRET_ID=$(terraform output -raw github_token_secret_id)
          if ! [[ "$SECRET_ID" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "ERROR: 'terraform output github_token_secret_id' did not return a valid secret id:" >&2
            echo "$SECRET_ID" >&2
            exit 1
          fi
          printf '%s' "${{ secrets.GH_PAT }}" | \
            gcloud secrets versions add "$SECRET_ID" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --data-file=-
