name: Lint & test infra

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  

permissions:
  contents: read

jobs:
  lint:
    name: fmt + validate + tflint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate (root + modules)
        run: |
          set -euo pipefail
          for dir in . modules/gh-runner-mig modules/server; do
            echo "== validating $dir =="
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: |
          tflint --init
          tflint --recursive

  terratest:
    name: terratest (plan-only, no cloud creds needed)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: go test
        working-directory: test
        env:
          GOFLAGS: -mod=mod
        run: go test ./... -v -timeout 20m
